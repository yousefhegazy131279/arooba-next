name: Android APK install check

on:
  push:
    paths:
      - .github/workflows/android-install-check.yml
      - public/downloads/arooba-android-v2.apk
  workflow_dispatch:

jobs:
  install-on-android-13:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Select release APK
        run: |
          cp public/downloads/arooba-android-v2.apk arooba.apk
          sha256sum arooba.apk
      - name: Install and launch on Android 13
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          script: |
            adb shell getprop ro.build.version.release
            adb install -r arooba.apk
            adb shell pm path com.hgz.arooba.mobile
            adb shell monkey -p com.hgz.arooba.mobile 1
